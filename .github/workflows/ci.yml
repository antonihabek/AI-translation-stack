name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Audit example catalogs
        run: npm run catalog:audit -- --config examples/translation.config.json

      - name: Check source scan ratchet
        run: npm run source:scan -- --config examples/translation.config.json --check

      - name: Scan for secrets
        run: npm run secret:scan

      - name: Inspect package contents
        run: npm run package:check
